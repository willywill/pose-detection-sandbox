<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Webcam Canvas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div id="selection-screen">
      <div class="selection-content">
        <h1>Will's Pose Experiments</h1>
        <p class="selection-subtitle">Choose an experiment to start.</p>
        <p class="camera-notice">A working camera is required.</p>
        <div id="experiment-buttons"></div>
      </div>
    </div>
    <canvas id="canvas"></canvas>
    <div id="debug" class="debug-panel" style="display:none;">
      <label class="debug-toggle">
        <input type="checkbox" id="debug-toggle-checkbox" checked>
        <span>Show Debug</span>
      </label>
      <div id="debug-content"></div>
    </div>
    <video id="webcam" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas-3d"></canvas>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>
    <script type="module" src="main.js"></script>
  </body>
</html>
